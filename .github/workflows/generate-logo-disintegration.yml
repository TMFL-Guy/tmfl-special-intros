name: Generate Titans Logo Disintegration CGI
on:
  workflow_dispatch:
    inputs:
      scene_duration:
        description: 'Seconds per transformation shot (0.5 to 4.5)'
        required: true
        default: '3.5'
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video dependencies
        run: |
          python -m pip install requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Animate Ravens logo disintegration and Titans logo emergence
        env:
          SELECT_SCENES: logo_disintegration,logo_emergence
          SCENE_DURATION: ${{ inputs.scene_duration }}
          SCENE_MAX_ATTEMPTS: '2'
        run: python scripts/generate_full_intro.py
      - name: Upload both CGI clips and combined video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TMFL-Titans-Logo-Disintegration
          path: |
            output/*.mp4
            output/*status.txt
          if-no-files-found: warn
          retention-days: 7
